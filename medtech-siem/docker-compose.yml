services:

  db:
    image: postgres:16
    container_name: medtech-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medtech_siem

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: .

    container_name: medtech-backend

    depends_on:
      - db

    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/medtech_siem

    ports:
      - "3000:3000"

  frontend:
    build: ./medtech-frontend

    container_name: medtech-frontend

    depends_on:
      - backend

    ports:
      - "5173:5173"

volumes:
  postgres_data: